name: Build

# The repository is private, so Actions minutes matter: runs are started by
# pushes (and manually), a newer push cancels the older run of the same ref,
# and the Nix build only runs on request.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 'ghcr.io/timower/rm-docker:main-qemu-toltec'

jobs:

  nix-build:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: 'true'
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - uses: cachix/cachix-action@v15
      with:
        name: rm2-stuff
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        # Skip qcow2 vm images and system tarballs.
        pushFilter: '(qcow2$|tarball-armv7l-unknown-linux-gnueabihf$|-rm-emu-|rm-nix-test|test-driver)'
    - run: nix build
    - run: nix build .#dev-cross
    - run: nix build .#dev-rm2-toolchain
    - run: nix build .#nixosConfigurations.example.config.system.build.toplevel
    - run: nix flake check -L --max-jobs 1

  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/toltec-dev/base:v4.0

    steps:
      - name: Install Deps
        run: apt-get update && apt-get install -y git git-lfs xxd

      - uses: actions/checkout@v4
        with:
          lfs: 'true'

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Configure CMake
        run: |
          . /opt/x-tools/switch-arm.sh
          cmake --preset release-toltec

      - name: Build
        run: cmake --build build/release-toltec

      - name: Package
        run: cmake --build build/release-toltec --target package

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: build/release-toltec/*.ipk

  build-host:
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: Install Deps
        run: |
         sudo apt-get update
         sudo apt-get install -y ninja-build libsdl2-dev xxd llvm libevdev-dev libsystemd-dev

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Configure CMake
        run: cmake --preset dev-host

      - name: Build
        run: cmake --build build/dev-host

      - name: Unit Tests
        run: cmake --build build/dev-host --target make-coverage

      # Only with a token (none exists in a fork unless added), and never fatal.
      - name: Upload Coverage
        if: ${{ env.CODECOV_TOKEN != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./build/dev-host/report.lcov
          fail_ci_if_error: false

      - name: Upload Test Binary
        uses: actions/upload-artifact@v4
        with:
          name: host-package
          path: build/dev-host/tools/rm2fb-emu/rm2fb-test

  # Vim (static, armv7) and the mozc chroot, with their emulated tests.
  extras:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build Vim
        run: shingetsu/vim/build-vim.sh

      - name: Test Vim
        run: shingetsu/test/qemu-vim-test.sh

      - name: Build mozc root
        run: shingetsu/mozc/build-rootfs.sh

      - name: Test mozc
        run: shingetsu/test/qemu-mozc-test.sh

      # upload-artifact does not keep symlinks or modes, so ship tarballs.
      - name: Pack
        run: |
          tar -C out -czf out/vim.tar.gz vim
          ls -l out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: extras
          path: |
            out/vim.tar.gz
            out/mozc-root-armhf.tar.gz
            out/mozc-root-armhf.tar.gz.sha256

  bundle:
    runs-on: ubuntu-latest
    needs: [build, extras]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: package
          path: inputs/cross

      - name: Download extras
        uses: actions/download-artifact@v4
        with:
          name: extras
          path: inputs/extras

      - name: Unpack inputs
        run: tar -xzf inputs/extras/vim.tar.gz -C inputs/extras

      - name: Make bundle
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version=${GITHUB_REF_NAME}
          else
            version=dev-${GITHUB_SHA::7}
          fi
          shingetsu/scripts/make-bundle.sh \
            --cross-build-dir inputs/cross \
            --vim-dir inputs/extras/vim \
            --mozc-tar inputs/extras/mozc-root-armhf.tar.gz \
            --version "$version"

      - name: Dry run of install.sh, uninstall.sh and try.sh
        run: shingetsu/test/bundle-dryrun.sh dist/rm2-shingetsu-*.tar.gz

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: |
            dist/*.tar.gz
            dist/*.sha256

